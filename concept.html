<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <title>Concept</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body { margin: 0; min-height: 100vh; overflow: hidden; color: #e7edf4; background: #141414; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
      .topbar { position: fixed; z-index: 3; inset: 0 0 auto; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgb(28 28 28 / 95%); border-bottom: 1px solid rgb(255 255 255 / 12%); }
      .topbar strong { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .4px; }
      .topbar span { color: #969696; font-size: 10.5px; }
      .panel { position: fixed; z-index: 2; inset: 36px auto 0 0; width: min(264px, calc(100vw - 32px)); background: rgb(28 28 28 / 94%); border-right: 1px solid rgb(255 255 255 / 12%); transition: transform 250ms cubic-bezier(.4,0,.2,1); }
      .panel__header { height: 0; overflow: hidden; }
      .panel__content { height: 100%; overflow-y: auto; padding: 12px 12px 20px; scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / 22%) transparent; }
      .world-label { min-height: 22px; display: flex; align-items: center; padding-left: 0; color: #888; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
      .section { border: 0; }
      .panel__content { padding: 8px 10px 20px; }
      .section > summary { min-height: 30px; display: flex; align-items: center; gap: 8px; margin: 0; padding: 0 2px; color: #c2c2c2; background: transparent; font-size: 10px; font-weight: 600; cursor: pointer; list-style: none; }
      .section > summary::-webkit-details-marker, .subsection > summary::-webkit-details-marker { display: none; }
      summary::before { content: "›"; width: 12px; color: #929ba5; font-size: 17px; line-height: 1; transform: rotate(0); transition: transform 140ms ease; }
      details[open] > summary::before { transform: rotate(90deg); }
      .section__body { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px 20px; }
      .grid-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #9fa8b2; font-size: 11px; }
      .grid-label output { color: #d1d7df; font-variant-numeric: tabular-nums; }
      .grid-slider { display: block; flex: 0 0 auto; width: 100%; height: 3px; margin: 0; accent-color: #8aafd4; cursor: pointer; }
      .tile-fields { display: flex; flex-direction: column; gap: 12px; }
      .tile-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 22px; color: #9fa8b2; font-size: 11px; }
      .tile-row > span:first-child { flex: 1; }
      .elevation-controls { display: flex; align-items: center; gap: 8px; color: #d1d7df; }
      .elevation-controls button { width: 22px; height: 22px; padding: 0; border: 1px solid #3b4148; border-radius: 4px; color: #d7dfe8; background: #24282d; cursor: pointer; }
      .elevation-controls button:hover { background: #30363d; }
      .follow-toggle { appearance: none; width: 30px; height: 16px; margin: 0; border-radius: 999px; background: #41464d; position: relative; cursor: pointer; transition: background 140ms ease; }
      .follow-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #d7dfe8; transition: transform 140ms ease; }
      .follow-toggle:checked { background: #668bad; }
      .follow-toggle:checked::after { transform: translateX(14px); }
      .subsection { margin: 2px 0; }
      .subsection > summary { min-height: 28px; display: flex; align-items: center; gap: 7px; color: #bfc7d0; font-size: 11px; cursor: pointer; list-style: none; }
      .subsection > summary::before { content: "›"; width: 10px; color: #7d8792; font-size: 15px; transition: transform 140ms ease; }
      .subsection[open] > summary::before { transform: rotate(90deg); }
      .fields { display: grid; gap: 8px; padding: 5px 4px 8px 17px; }
      .field { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #9fa8b2; font-size: 11px; }
      .field span { color: #d1d7df; }
      .field input[type="number"], .field select { width: 92px; height: 25px; padding: 0 7px; border: 1px solid #3b4148; border-radius: 4px; outline: 0; color: #e0e6ed; background: #24282d; font: inherit; }
      .field input:focus, .field select:focus { border-color: #718eae; }
      .field input[type="checkbox"] { width: 14px; height: 14px; accent-color: #8aafd4; }
      .panel__toggle { position: fixed; top: 46px; left: min(264px, calc(100vw - 32px)); width: 22px; height: 30px; display: grid; place-items: center; padding: 0; border: 1px solid rgb(255 255 255 / 14%); border-left: 0; border-radius: 0 4px 4px 0; color: #c2c2c2; background: rgb(34 34 34 / 95%); cursor: pointer; transition: left 250ms cubic-bezier(.4,0,.2,1), background 150ms; }
      .panel__toggle:hover { background: #292929; }
      .panel__toggle:focus-visible { outline: 2px solid #91baff; outline-offset: 2px; }
      .panel__toggle svg { width: 16px; height: 16px; transition: transform 220ms ease; }
      .panel.is-hidden { transform: translateX(-100%); }
      .panel.is-hidden .panel__toggle { left: 0; }
      .panel.is-hidden .panel__toggle svg { transform: rotate(180deg); }
      @media (prefers-reduced-motion: reduce) { .panel, .panel__toggle svg, summary::before { transition: none; } }
      /* Layout follows Iso Playground: compact chrome and flex based inspector panels. */
      body { font-size: 11px; user-select: none; }
      .topbar { gap: 12px; }
      .topbar .brand { display:flex; align-items:center; gap:14px; min-width:0; }
      .topbar nav { display:flex; align-items:center; gap:2px; }
      .topbar nav button { padding:4px 8px; border:0; border-radius:3px; color:#c2c2c2; background:transparent; font:inherit; cursor:pointer; }
      .topbar nav button:hover, .tool-button:hover { background:rgba(255,255,255,.1); color:#fff; }
      .topbar .header-tools { display:flex; align-items:center; gap:6px; }
      .tool-button { width:30px; height:30px; display:grid; place-items:center; padding:6px; border:1px solid rgba(255,255,255,.14); border-radius:6px; color:#dcdcdc; background:rgba(28,28,28,.82); cursor:pointer; }
      .tool-button svg { width:16px; height:16px; }
      .panel__content { display:flex; flex-direction:column; gap:10px; }
      .section { flex:0 0 auto; }
      .section > summary { border-bottom:1px solid rgba(255,255,255,.08); }
      .section__body { gap:9px; }
      .quick-actions { position:fixed; z-index:16; top:46px; right:249px; display:flex; align-items:center; gap:6px; transition:right 220ms cubic-bezier(.4,0,.2,1); }
      .quick-action { width:32px; height:32px; display:grid; place-items:center; padding:0; border:1px solid rgba(255,255,255,.14); border-radius:6px; color:#dcdcdc; background:rgba(28,28,28,.82); cursor:pointer; }
      .quick-action:hover { background:rgba(45,45,45,.96); color:#fff; }
      .quick-action:focus-visible, .right-expand:focus-visible { outline:2px solid #91baff; outline-offset:2px; }
      .quick-action svg { width:16px; height:16px; }
      .right-stack { display:contents; }
      .right-panel { position:fixed; z-index:15; right:12px; width:225px; max-width:calc(100vw - 24px); display:flex; flex-direction:column; gap:8px; min-height:0; overflow:hidden; padding:10px; border:1px solid rgba(255,255,255,.12); border-radius:8px; background:rgba(28,28,28,.88); transition:width 220ms cubic-bezier(.4,0,.2,1); }
      .right-panel.upper { top:48px; height:260px; }
      .right-panel.lower { top:318px; bottom:12px; }
      .right-panel.is-expanded { width:450px; }
      .right-expand { position:fixed; z-index:17; right:237px; width:22px; height:30px; display:grid; place-items:center; padding:0; border:1px solid rgba(255,255,255,.14); border-right:0; border-radius:4px 0 0 4px; color:#c2c2c2; background:rgba(34,34,34,.95); cursor:pointer; transition:right 220ms cubic-bezier(.4,0,.2,1), background 150ms, color 150ms; }
      .right-expand:hover { background:#363636; color:#fff; }
      .right-expand svg { width:12px; height:12px; transition:transform 220ms ease; }
      .right-expand.is-expanded { right:462px; }
      .right-expand.is-expanded svg { transform:rotate(180deg); }
      .right-expand.upper-toggle { top:178px; }
      .right-expand.lower-toggle { top:calc(50vh + 153px); }
      body.right-wide .quick-actions { right:474px; }
      .right-title { display:flex; flex:0 0 auto; align-items:center; justify-content:space-between; min-height:22px; padding-bottom:5px; border-bottom:1px solid rgba(255,255,255,.08); color:#a4a4a4; font-size:10.5px; font-weight:600; letter-spacing:.7px; }
      .right-content { display:flex; flex:1 1 auto; flex-direction:column; gap:8px; min-height:0; overflow:auto; }
      .object-empty { display:flex; flex:1; align-items:center; justify-content:center; color:#777; }
      .footer-bar { position:fixed; z-index:2; right:min(249px,calc(100vw - 16px)); bottom:10px; left:278px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:rgba(255,255,255,.68); font-size:10.5px; text-shadow:0 1px 3px #000; pointer-events:none; }
      .footer-bar > * { min-width:0; }
      .footer-meta { display:flex; flex-wrap:wrap; gap:10px; }
      .footer-meta strong { color:#9ec5ff; font-weight:500; }
      @media(max-width:760px) {
        .topbar nav,.topbar>span,.topbar .header-tools { display:none; }
        .quick-actions, body.right-wide .quick-actions { right:12px; }
        .right-panel { width:min(225px,calc(100vw - 24px)); }
        .right-panel.is-expanded { width:min(450px,calc(100vw - 24px)); }
        .right-expand { right:calc(12px + min(225px,100vw - 24px)); }
        .right-expand.is-expanded { right:calc(12px + min(450px,100vw - 24px)); }
        .right-panel.lower { top:auto; bottom:48px; height:min(46vh,390px); }
        .right-expand.lower-toggle { top:auto; bottom:calc(48px + min(23vh,195px) - 15px); }
        .footer-bar { left:12px; right:12px; }
      }
      @media (prefers-reduced-motion: reduce) { .quick-actions, .right-panel, .right-expand, .right-expand svg { transition:none; } }
    </style>
  </head>
  <body>
    <header class="topbar"><div class="brand"><strong>Iso Playground</strong><nav aria-label="Menu"><button type="button">File</button><button type="button">Edit</button><button type="button">Tampilan</button><button type="button">Bantuan</button></nav></div><span>Plane 16 × 16 m²</span></header>
    <div class="quick-actions" aria-label="Aksi cepat">
      <button class="quick-action" type="button" aria-label="Simpan proyek" title="Simpan proyek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
      <button class="quick-action" type="button" aria-label="Buka sandbox" title="Buka sandbox"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="quick-action" type="button" aria-label="Impor proyek" title="Impor proyek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v4h14v-4"/></svg></button>
      <button class="quick-action" type="button" aria-label="Reset kamera" title="Reset kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
    </div>
    <iframe src="./index.html" title="Isometric Plane"></iframe>
    <aside class="panel" id="side-panel">
      <div class="panel__header">Inspect Panel</div>
      <div class="panel__content">
        <div class="world-label">WORLD</div>
        <details class="section"><summary>PLANE</summary><div class="section__body"><label class="grid-label" for="grid-count">Jumlah grid <output id="grid-value">16×16</output></label><input class="grid-slider" id="grid-count" type="range" min="16" max="64" value="16" aria-label="Jumlah grid"></div></details>
        <details class="section"><summary>TILE</summary><div class="section__body"><div class="tile-fields"><div class="tile-row">Koordinat <span>0,0</span></div><div class="tile-row"><span>Elevation</span><span class="elevation-controls"><button type="button" aria-label="Kurangi elevation" data-step="-1">−</button><output class="elevation-value">0</output><button type="button" aria-label="Tambah elevation" data-step="1">+</button></span></div></div></div></details>
        <details class="section"><summary>CAMERA</summary><div class="section__body"><label class="tile-row">Mengikuti Objek <input class="follow-toggle" type="checkbox" aria-label="Mengikuti Objek"></label></div></details>
        <details class="section"><summary>OBJECT</summary><div class="section__body"></div></details>
      </div>
      <button class="panel__toggle" type="button" aria-label="Sembunyikan panel" aria-controls="side-panel" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </aside>
    <div class="right-stack" aria-label="Inspector kanan">
      <aside class="right-panel upper" id="objects-panel"><div class="right-title"><span>OBJECTS</span><span>0</span></div><div class="right-content"><div class="object-empty">Belum ada objek</div></div></aside>
      <aside class="right-panel lower" id="selection-panel"><div class="right-title"><span>SELECTION</span><span>—</span></div><div class="right-content"><div class="tile-row"><span>Koordinat aktif</span><span>0, 0</span></div><div class="tile-row"><span>Elevation</span><span>0</span></div><div class="tile-row"><span>Camera</span><span>100%</span></div></div></aside>
    </div>
    <button class="right-expand upper-toggle" type="button" aria-label="Perluas panel objek" aria-controls="objects-panel" aria-expanded="false" title="Perluas panel ke kiri"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="right-expand lower-toggle" type="button" aria-label="Perluas panel selection" aria-controls="selection-panel" aria-expanded="false" title="Perluas panel ke kiri"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <footer class="footer-bar"><div class="footer-meta"><span>1 petak = 1 m²</span><span>World: 16 × 16 m²</span><strong>Tile: 0, 0</strong></div><span>Zoom: 100%</span></footer>
    <script>
      const panel = document.querySelector("#side-panel");
      const toggle = panel.querySelector(".panel__toggle");
      const gridSlider = document.querySelector("#grid-count");
      const gridValue = document.querySelector("#grid-value");
      gridSlider.addEventListener("input", () => {
        gridValue.value = `${gridSlider.value}×${gridSlider.value}`;
      });
      document.querySelectorAll(".elevation-controls button").forEach((button) => {
        button.addEventListener("click", () => {
          const value = button.closest(".elevation-controls").querySelector(".elevation-value");
          value.value = Number(value.value) + Number(button.dataset.step);
        });
      });
      toggle.addEventListener("click", () => {
        const isHidden = panel.classList.toggle("is-hidden");
        toggle.setAttribute("aria-expanded", String(!isHidden));
        toggle.setAttribute("aria-label", isHidden ? "Tampilkan panel" : "Sembunyikan panel");
      });
      document.querySelectorAll(".right-expand").forEach((button) => {
        button.addEventListener("click", () => {
          const target = document.getElementById(button.getAttribute("aria-controls"));
          const expanded = target.classList.toggle("is-expanded");
          button.classList.toggle("is-expanded", expanded);
          button.setAttribute("aria-expanded", String(expanded));
          const label = expanded ? "Perkecil panel" : "Perluas panel ke kiri";
          button.setAttribute("aria-label", label);
          button.title = label;
          if (target.id === "objects-panel") document.body.classList.toggle("right-wide", expanded);
        });
      });
    </script>
  </body>
</html>
