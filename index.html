<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Canvas</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <canvas id="canvas" aria-label="Area kanvas"></canvas>
  <section class="inspector" aria-label="Pengaturan bidang">
    <div class="inspector-heading">
      <h1>Ukuran bidang</h1>
      <output id="grid-size-value" for="grid-size">9 × 9</output>
    </div>
    <input id="grid-size" type="range" min="9" max="63" step="2" value="9" aria-label="Ukuran bidang">
    <div class="inspector-range" aria-hidden="true"><span>9 × 9</span><span>63 × 63</span></div>
  </section>
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
