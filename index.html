<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <title>Iso Playground</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #141414;
        --surface: rgb(28 28 28 / 95%);
        --surface-solid: #1c1c1c;
        --border: rgb(255 255 255 / 12%);
        --border-soft: rgb(255 255 255 / 8%);
        --text: #e7edf4;
        --muted: #969696;
        --accent: #3478f6;
        --inspector-width: 264px;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        color: var(--text);
        background: var(--background);
        font: 11px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      button { font: inherit; }
      main {
        position: relative;
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .board {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 768px;
        height: 384px;
        margin: -192px 0 0 -384px;
        transform-origin: center center;
        will-change: transform;
      }
      canvas {
        display: block;
        width: 768px;
        height: 384px;
        overflow: visible;
        touch-action: none;
      }
      .topbar {
        position: fixed;
        z-index: 5;
        inset: 0 0 auto;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        backdrop-filter: blur(12px);
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand strong { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .25px; }
      .brand span { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
      .header-tools { display: flex; align-items: center; gap: 6px; }
      .tool-button {
        min-width: 30px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: #dcdcdc;
        background: rgb(28 28 28 / 82%);
        cursor: pointer;
      }
      .tool-button:hover { color: #fff; background: rgb(255 255 255 / 9%); }
      .tool-button:focus-visible, .panel-toggle:focus-visible, summary:focus-visible {
        outline: 2px solid #91baff;
        outline-offset: 2px;
      }
      .tool-button svg { width: 15px; height: 15px; }
      .inspector-panel {
        position: fixed;
        z-index: 3;
        inset: 38px auto 0 0;
        width: min(var(--inspector-width), calc(100vw - 32px));
        border-right: 1px solid var(--border);
        background: rgb(28 28 28 / 94%);
        backdrop-filter: blur(12px);
        transition: transform 220ms cubic-bezier(.4, 0, .2, 1);
      }
      .inspector-panel.is-hidden { transform: translateX(-100%); }
      .panel-content {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 9px;
        overflow-y: auto;
        padding: 10px 10px 20px;
        scrollbar-width: thin;
        scrollbar-color: rgb(255 255 255 / 22%) transparent;
      }
      .world-label {
        min-height: 22px;
        display: flex;
        align-items: center;
        color: #888;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .06em;
      }
      .section { flex: 0 0 auto; border: 0; }
      .section > summary {
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 2px;
        border-bottom: 1px solid var(--border-soft);
        color: #c2c2c2;
        background: transparent;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
      }
      .section > summary::-webkit-details-marker { display: none; }
      .section > summary::before {
        content: "›";
        width: 12px;
        color: #929ba5;
        font-size: 17px;
        line-height: 1;
        transition: transform 140ms ease;
      }
      .section[open] > summary::before { transform: rotate(90deg); }
      .section-body { display: flex; flex-direction: column; gap: 9px; padding: 9px 2px 11px 20px; }
      .inspector-row {
        display: flex;
        min-height: 20px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #9fa8b2;
        font-size: 11px;
      }
      .inspector-row output, .inspector-row strong {
        color: #d1d7df;
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .panel-toggle {
        position: fixed;
        z-index: 5;
        top: 48px;
        left: min(var(--inspector-width), calc(100vw - 32px));
        width: 22px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 4px 4px 0;
        color: #c2c2c2;
        background: rgb(34 34 34 / 95%);
        cursor: pointer;
        transition: left 220ms cubic-bezier(.4, 0, .2, 1), background 150ms;
      }
      .panel-toggle:hover { background: #292929; }
      .inspector-panel.is-hidden + .panel-toggle { left: 0; }
      .panel-toggle svg { width: 16px; height: 16px; transition: transform 220ms ease; }
      .panel-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
      .selection-panel {
        position: fixed;
        z-index: 4;
        top: 50px;
        right: 12px;
        width: min(225px, calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgb(28 28 28 / 90%);
        backdrop-filter: blur(12px);
      }
      .right-title {
        display: flex;
        min-height: 22px;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 5px;
        border-bottom: 1px solid var(--border-soft);
        color: #a4a4a4;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: .6px;
      }
      .selection-summary { color: #d1d7df; font-size: 11px; }
      .selection-fields { display: grid; gap: 8px; }
      .footer-bar {
        position: fixed;
        z-index: 5;
        right: min(249px, calc(100vw - 16px));
        bottom: 10px;
        left: 278px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: rgb(255 255 255 / 68%);
        font-size: 10.5px;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }
      .footer-meta { display: flex; flex-wrap: wrap; gap: 10px; }
      .footer-meta strong { color: #9ec5ff; font-weight: 500; }
      .readout { color: #aeb7c2; }
      @media (max-width: 760px) {
        .brand span { display: none; }
        .selection-panel { top: auto; right: 10px; bottom: 48px; width: min(225px, calc(100vw - 20px)); }
        .footer-bar { right: 10px; bottom: 10px; left: 10px; }
        .footer-meta { max-width: calc(100% - 90px); gap: 5px 9px; }
      }
      @media (max-width: 420px) {
        .inspector-panel { width: min(248px, calc(100vw - 48px)); }
        .panel-toggle { left: min(248px, calc(100vw - 48px)); }
        .brand strong { font-size: 11px; }
        .tool-button { width: 28px; padding: 0 6px; }
        .tool-button span { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .inspector-panel, .panel-toggle, .panel-toggle svg, .section > summary::before { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Iso Playground</strong>
        <span>Plane · 12 × 12 tile</span>
      </div>
      <div class="header-tools">
        <button class="tool-button" id="reset-camera" type="button" aria-label="Reset kamera" title="Reset kamera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" />
          </svg>
          <span>Reset kamera</span>
        </button>
      </div>
    </header>

    <main aria-label="Workspace plane isometrik">
      <div class="board">
        <canvas id="plane" aria-label="Plane isometrik" role="img"></canvas>
      </div>
    </main>

    <aside class="inspector-panel" id="inspector-panel" aria-label="Inspector workspace">
      <div class="panel-content">
        <div class="world-label">WORKSPACE</div>
        <details class="section" open>
          <summary>PLANE</summary>
          <div class="section-body">
            <div class="inspector-row"><span>Ukuran grid</span><output id="plane-size">12 × 12 tile</output></div>
            <div class="inspector-row"><span>Ukuran tile</span><output id="tile-size">64 × 32 px</output></div>
          </div>
        </details>
        <details class="section" open>
          <summary>TILE</summary>
          <div class="section-body">
            <div class="inspector-row"><span>Hover</span><output id="hover-value">—</output></div>
            <div class="inspector-row"><span>Terpilih</span><output id="selected-value">—</output></div>
          </div>
        </details>
        <details class="section" open>
          <summary>CAMERA</summary>
          <div class="section-body">
            <div class="inspector-row"><span>Zoom</span><output id="camera-zoom">100%</output></div>
            <div class="inspector-row"><span>Pan</span><output id="camera-pan">+0, +0 px</output></div>
            <div class="inspector-row"><span>Status</span><output id="camera-mode">Siap</output></div>
          </div>
        </details>
      </div>
    </aside>
    <button class="panel-toggle" id="inspector-toggle" type="button" aria-label="Sembunyikan inspector" aria-controls="inspector-panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>

    <aside class="selection-panel" aria-label="Detail tile terpilih">
      <div class="right-title"><span>SELECTION</span><span id="selected-index">—</span></div>
      <div class="selection-summary" id="selection-summary">Belum ada tile dipilih</div>
      <div class="selection-fields">
        <div class="inspector-row"><span>Koordinat grid</span><output id="selected-detail-coord">—</output></div>
        <div class="inspector-row"><span>Pusat tile</span><output id="selected-center">—</output></div>
      </div>
    </aside>

    <footer class="footer-bar">
      <div class="footer-meta">
        <span>1 tile = 64 × 32 px</span>
        <strong id="footer-selection">Tidak ada tile aktif</strong>
        <output class="readout" id="readout" aria-live="polite">Arahkan kursor ke tile</output>
      </div>
      <output id="footer-zoom">Zoom: 100%</output>
    </footer>

    <script type="module">
      import { initializePlane } from "./plane.js";
      initializePlane();
    </script>
  </body>
</html>
