<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Canvas</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <canvas id="canvas" aria-label="Area kanvas"></canvas>
  <section class="inspector" aria-label="Pengaturan bidang">
    <div class="inspector-heading">
      <h1>Ukuran bidang</h1>
      <output id="grid-size-value" for="grid-size">9 × 9</output>
    </div>
    <input id="grid-size" type="range" min="9" max="63" step="2" value="9" aria-label="Ukuran bidang">
    <div class="inspector-range" aria-hidden="true"><span>9 × 9</span><span>63 × 63</span></div>
    <div class="inspector-toggles">
      <label><input id="show-axes" type="checkbox" checked> <span>Sumbu</span></label>
      <label><input id="show-grid" type="checkbox" checked> <span>Grid</span></label>
    </div>
  </section>
  <section class="hover-card" aria-label="Koordinat tile yang diarahkan">
    <h2>Koordinat tile</h2>
    <div class="coordinate-row"><span>Hover</span><output id="hover-coordinates" aria-live="polite">—</output></div>
    <div class="coordinate-row"><span>Tile aktif</span><output id="active-coordinates" aria-live="polite">0 tile aktif</output></div>
  </section>
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
