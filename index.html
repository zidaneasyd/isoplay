<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <title>Isometric Plane</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        color: #e7edf4;
        background: #141414;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .board {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 768px;
        height: 384px;
        margin-left: -384px;
        margin-top: -192px;
        transform-origin: center center;
        will-change: transform;
      }
      canvas {
        display: block;
        width: 768px;
        height: 384px;
        overflow: visible;
        touch-action: none;
      }
      .readout {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        padding: 8px 11px;
        border: 1px solid #333;
        border-radius: 6px;
        color: #ddd;
        background: #1c1c1c;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="board">
        <canvas id="plane" aria-label="Plane isometrik"></canvas>
      </div>
      <output class="readout" id="readout" aria-live="polite">Arahkan kursor ke tile</output>
    </main>
    <script type="module">
      import { initializePlane } from "./plane.js";
      initializePlane();
    </script>
  </body>
</html>
